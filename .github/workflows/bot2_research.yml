name: Bot2 - Research Backtest
on:
  workflow_dispatch:
    inputs:
      notify:
        description: Send research status to Bot 2 after completion
        type: boolean
        default: true
permissions:
  contents: write
# Shared with the scan workflow. State must never be updated concurrently.
concurrency:
  group: btc-bot2-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v6
        with:
          path: data/cache
          key: bot2-verified-archives-v1-${{ hashFiles('config.yaml') }}
          restore-keys: bot2-verified-archives-v1-
      - name: Download verified real archives and backtest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT2_TOKEN: ${{ secrets.TELEGRAM_BOT2_TOKEN }}
          TELEGRAM_BOT2_CHAT_ID: ${{ secrets.TELEGRAM_BOT2_CHAT_ID }}
          NOTIFY: ${{ inputs.notify }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          args=(research --download --output output)
          if [ "$NOTIFY" = "true" ]; then args+=(--notify); fi
          python main.py "${args[@]}"
      - name: Show research report
        if: always()
        shell: bash
        run: |
          if [ -f output/BACKTEST_REPORT.md ]; then
            cat output/BACKTEST_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Research did not finish. Inspect the error and data-manifest artifacts. No new proof of edge was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bot2-research-${{ github.run_id }}
          path: output/
          retention-days: 60
          if-no-files-found: warn
