name: Bot2 - Check Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check official archive and live-data access
        run: python main.py check-data --output output
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bot2-provider-check-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn
