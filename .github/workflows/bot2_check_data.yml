name: Bot2 - Check Data
on:
  workflow_dispatch:
    inputs:
      section:
        description: Archive and live access are checked independently
        type: choice
        options: [both, archive, live]
        default: both
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ fromJSON(vars.BOT2_LIVE_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test archive separately from live market data
        env:
          SECTION: ${{ inputs.section }}
        shell: bash
        run: python main.py check-data --section "$SECTION" --output output
      - name: Show checks
        if: always()
        run: python scripts/show_summary.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: bot2-v12-data-check-${{ github.run_id }}
          path: output/
          retention-days: 14
